<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urus Restoran</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1f1d1a;--mu:#6b665e;--bd:#e3ded4;--ac:#c2410c;--acx:#fff;--ok:#15803d;--okb:#dcfce7;--wn:#b45309;--wnb:#fef3c7;--er:#b91c1c;--erb:#fee2e2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--tx:#f1ede6;--mu:#a39d92;--bd:#38332c;--ac:#fb923c;--acx:#1a1208;--ok:#86efac;--okb:#14391f;--wn:#fcd34d;--wnb:#3d2f0a;--er:#fca5a5;--erb:#451a1a}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--tx:#f1ede6;--mu:#a39d92;--bd:#38332c;--ac:#fb923c;--acx:#1a1208;--ok:#86efac;--okb:#14391f;--wn:#fcd34d;--wnb:#3d2f0a;--er:#fca5a5;--erb:#451a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
h1{font-size:17px;margin:0;flex:1}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}
nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p,nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}button.no{background:var(--erb);color:var(--er);border-color:var(--er)}
main{padding:0 14px 40px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.g{background:var(--okb);color:var(--ok)}.y{background:var(--wnb);color:var(--wn)}.r{background:var(--erb);color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.note{padding:10px;border-bottom:1px solid var(--bd)}.note.u{border-left:4px solid var(--ac);background:var(--wnb)}.note small{color:var(--mu)}
.bell{position:relative}.bell i{position:absolute;top:-6px;right:-6px;background:var(--er);color:#fff;border-radius:99px;font:700 11px/1 system-ui;padding:3px 5px;font-style:normal}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;z-index:9}
#toast.s{opacity:1}textarea{width:100%;min-height:90px;font-family:ui-monospace,monospace;font-size:13px}.mu{color:var(--mu);font-size:13px}
</style></head><body>
<header><h1>🍽️ Urus Restoran</h1>
<select id="role"></select>
<button class="bell" id="bell">🔔<i id="cnt" hidden>0</i></button></header>
<nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script>
const K='restoran_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seed=()=>({emps:[{id:'101',name:'Ahmad',role:'Cef',rate:12,shift:'P'},{id:'102',name:'Siti',role:'Pelayan',rate:9,shift:'P'},{id:'103',name:'Raju',role:'Kasyier',rate:9,shift:'S'},{id:'104',name:'Mei Ling',role:'Pelayan',rate:9,shift:'S'}],
shifts:[{id:'P',name:'Pagi',s:'07:00',e:'15:00'},{id:'S',name:'Petang',s:'15:00',e:'23:00'}],sched:{},att:[],leaves:[],notes:[],cfg:{grace:5,otMin:30,otRate:1.5,hrs:8}});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let role='manager',tab='',me=()=>S.emps.find(e=>e.id===role);
const today=new Date().toISOString().slice(0,10),mon0=today.slice(0,7);
const tm=t=>{const m=/(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const nm=id=>(S.emps.find(e=>e.id===id)||{name:id}).name;
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',2500)};
function notify(to,msg){S.notes.unshift({id:Date.now()+Math.random(),to,msg,t:new Date().toLocaleString('ms-MY'),read:false});if(to===role)toast(msg);save()}
function shiftOf(id,d){const e=S.emps.find(x=>x.id===id);const v=S.sched[id+'|'+d]??(e&&e.shift);return v==='OFF'?null:S.shifts.find(s=>s.id===v)}
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
function mondayOf(d){const x=new Date(d+'T00:00:00Z');return addDays(d,-((x.getUTCDay()+6)%7))}
function normDate(s){let m=/(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[0];m=/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/.exec(s);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null}
function mcDays(id,month){let n=0;S.leaves.filter(l=>l.emp===id&&l.type==='MC'&&l.status==='approved').forEach(l=>{for(let d=l.from;d<=l.to;d=addDays(d,1))if(d.startsWith(month))n++});return n}
function calc(month){return S.emps.map(e=>{let days=0,late=0,ot=0,miss=0;S.att.filter(a=>a.id===e.id&&a.date.startsWith(month)).forEach(a=>{const sh=shiftOf(e.id,a.date);days++;if(!sh)return;const i=tm(a.in),o=tm(a.out);const l=i-tm(sh.s);if(l>S.cfg.grace)late+=l;if(o===null||o===i){miss++;return}const x=o-tm(sh.e);if(x>=S.cfg.otMin)ot+=x});
const mc=mcDays(e.id,month),otPay=ot/60*e.rate*S.cfg.otRate,ded=mc*e.rate*S.cfg.hrs;return{e,days,late,ot,miss,mc,otPay,ded,net:otPay-ded}})}
function importCSV(txt){const g={};txt.split(/\r?\n/).forEach(ln=>{const p=ln.split(/[,;\t]/).map(x=>x.trim());const id=p[0];const d=normDate(ln);if(!id||!d||!S.emps.some(e=>e.id===id))return;const ts=ln.replace(/\d{4}-\d{2}-\d{2}|\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/,'').match(/\d{1,2}:\d{2}/g)||[];ts.forEach(t=>(g[id+'|'+d]??=[]).push(tm(t)))});
let n=0;Object.entries(g).forEach(([k,v])=>{const[id,date]=k.split('|');const i=Math.min(...v),o=Math.max(...v);S.att=S.att.filter(a=>!(a.id===id&&a.date===date));S.att.push({id,date,in:hm(i),out:v.length>1?hm(o):''});n++;
const sh=shiftOf(id,date);if(sh&&i-tm(sh.s)>S.cfg.grace)notify('manager',`${nm(id)} lewat ${i-tm(sh.s)} min pada ${date}`)});save();return n}
function render(){
const mg=role==='manager';
$('#role').innerHTML=`<option value="manager">Pengurus</option>`+S.emps.map(e=>`<option value="${e.id}">${esc(e.name)} (staf)</option>`).join('');$('#role').value=role;
const tabs=mg?[['notif','Notifikasi'],['cuti','Cuti'],['syif','Syif'],['hadir','Thumbprint'],['gaji','OT & MC'],['pekerja','Pekerja']]:[['notif','Notifikasi'],['cuti','Cuti Saya'],['syif','Syif Saya']];
if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
$('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
const u=S.notes.filter(n=>n.to===role&&!n.read).length;$('#cnt').hidden=!u;$('#cnt').textContent=u;
$('#app').innerHTML=({notif,cuti,syif,hadir,gaji,pekerja})[tab]();
}
function notif(){const l=S.notes.filter(n=>n.to===role);const h=`<div class="card"><h2>Notifikasi</h2><button id="mark">Tanda semua dibaca</button>${l.map(n=>`<div class="note ${n.read?'':'u'}">${esc(n.msg)}<br><small>${n.t}</small></div>`).join('')||'<p class="mu">Tiada notifikasi.</p>'}</div>`;return h}
function cuti(){const mg=role==='manager';
const form=mg?'':`<div class="card"><h2>Mohon Cuti</h2><div class="row"><label>Jenis<select id="lt"><option>Cuti Tahunan</option><option>MC</option><option>Kecemasan</option></select></label><label>Dari<input type="date" id="lf" value="${today}"></label><label>Hingga<input type="date" id="ltt" value="${today}"></label></div><div class="row"><label style="flex:1">Sebab<input id="lr"></label><label>Bukti (gambar/PDF)<input type="file" id="lp"></label></div><button class="p" id="lsub">Hantar Permohonan</button><p class="mu">Jika tiada bukti, status "Tiada bukti" akan dipaparkan kepada pengurus, tetapi permohonan masih boleh diluluskan.</p></div>`;
const ls=S.leaves.filter(l=>mg||l.emp===role);
const st={pending:['y','Menunggu'],approved:['g','Diluluskan'],rejected:['r','Ditolak']};
return form+`<div class="card"><h2>Senarai Permohonan</h2><div class="wrap"><table><tr><th>Pekerja</th><th>Jenis</th><th>Tarikh</th><th>Sebab</th><th>Bukti</th><th>Status</th>${mg?'<th></th>':''}</tr>${ls.map((l,i)=>`<tr><td>${esc(nm(l.emp))}</td><td>${esc(l.type)}</td><td>${l.from} → ${l.to}</td><td>${esc(l.reason)}</td><td>${l.proof?`<span class="b g">Ada: ${esc(l.proof)}</span>`:'<span class="b y">Tiada bukti</span>'}</td><td><span class="b ${st[l.status][0]}">${st[l.status][1]}</span></td>${mg?`<td>${l.status==='pending'?`<button class="ok" data-a="approved" data-i="${l.id}">Lulus</button> <button class="no" data-a="rejected" data-i="${l.id}">Tolak</button>`:''}</td>`:''}</tr>`).join('')||'<tr><td class="mu">Tiada permohonan.</td></tr>'}</table></div></div>`}
let wk=mondayOf(today);
function syif(){const mg=role==='manager',days=[...Array(7)].map((_,i)=>addDays(wk,i));const es=mg?S.emps:S.emps.filter(e=>e.id===role);
const opts=v=>S.shifts.map(s=>`<option value="${s.id}" ${v===s.id?'selected':''}>${s.name} ${s.s}-${s.e}</option>`).join('')+`<option value="OFF" ${v==='OFF'?'selected':''}>Cuti/Off</option>`;
return `<div class="card"><h2>Jadual Syif</h2><div class="row"><label>Minggu bermula<input type="date" id="wk" value="${wk}"></label></div><div class="wrap"><table><tr><th>Pekerja</th>${days.map(d=>`<th>${d.slice(5)}</th>`).join('')}</tr>${es.map(e=>`<tr><td>${esc(e.name)}</td>${days.map(d=>{const v=S.sched[e.id+'|'+d]??e.shift;return `<td>${mg?`<select data-k="${e.id}|${d}">${opts(v)}</select>`:esc((S.shifts.find(s=>s.id===v)||{name:'Off'}).name)}</td>`}).join('')}</tr>`).join('')}</table></div></div>`}
function hadir(){const rows=[...S.att].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);
return `<div class="card"><h2>Tarik Data Thumbprint</h2><p class="mu">Format: ID,Tarikh,Masuk,Keluar (CSV dari mesin). Jika ada banyak cap jari sehari, sistem ambil yang paling awal & lewat. Syif pekerja digunakan untuk kira lewat dan OT.</p><input type="file" id="csv" accept=".csv,.txt"><textarea id="ta" placeholder="101,${today},07:12,15:50"></textarea><div class="row"><button class="p" id="imp">Import</button><button id="demo">Isi contoh data</button></div></div>
<div class="card"><h2>Rekod Kehadiran</h2><div class="wrap"><table><tr><th>Pekerja</th><th>Tarikh</th><th>Syif</th><th>Masuk</th><th>Keluar</th><th>Lewat</th><th>OT</th></tr>${rows.map(a=>{const sh=shiftOf(a.id,a.date),i=tm(a.in),o=tm(a.out);const l=sh?i-tm(sh.s):0,x=sh&&o!==null?o-tm(sh.e):0;return `<tr><td>${esc(nm(a.id))}</td><td>${a.date}</td><td>${sh?sh.name:'Off'}</td><td>${a.in}</td><td>${a.out||'<span class="b y">tiada</span>'}</td><td>${l>S.cfg.grace?`<span class="b r">${l} min</span>`:'-'}</td><td>${x>=S.cfg.otMin?`<span class="b g">${x} min</span>`:'-'}</td></tr>`}).join('')||'<tr><td class="mu">Belum ada data.</td></tr>'}</table></div></div>`}
let gm=mon0;
function gaji(){const r=calc(gm),f=n=>n.toFixed(2),c=S.cfg;
return `<div class="card"><h2>Kiraan OT & Tolak MC</h2><div class="row"><label>Bulan<input type="month" id="gm" value="${gm}"></label><label>Grace lewat (min)<input type="number" id="c1" value="${c.grace}" style="width:80px"></label><label>OT mula selepas (min)<input type="number" id="c2" value="${c.otMin}" style="width:80px"></label><label>Kadar OT (x)<input type="number" step="0.1" id="c3" value="${c.otRate}" style="width:80px"></label><label>Jam sehari<input type="number" id="c4" value="${c.hrs}" style="width:70px"></label></div>
<div class="wrap"><table><tr><th>Pekerja</th><th>Hari hadir</th><th>Lewat (min)</th><th>OT (jam)</th><th>OT (RM)</th><th>MC (hari)</th><th>Tolak MC (RM)</th><th>Bersih (RM)</th></tr>${r.map(x=>`<tr><td>${esc(x.e.name)}${x.miss?` <span class="b y">${x.miss} tiada cap keluar</span>`:''}</td><td>${x.days}</td><td>${x.late}</td><td>${f(x.ot/60)}</td><td>${f(x.otPay)}</td><td>${x.mc}</td><td>-${f(x.ded)}</td><td><b>${f(x.net)}</b></td></tr>`).join('')}</table></div><p class="mu">Bersih = OT − tolak MC. Tolak MC = hari MC lulus × kadar sejam × jam sehari. Hanya MC yang diluluskan ditolak.</p></div>`}
function pekerja(){return `<div class="card"><h2>Senarai Pekerja (${S.emps.length})</h2><div class="wrap"><table><tr><th>ID (thumbprint)</th><th>Nama</th><th>Jawatan</th><th>RM/jam</th><th>Syif asal</th><th></th></tr>${S.emps.map(e=>`<tr><td>${e.id}</td><td>${esc(e.name)}</td><td>${esc(e.role)}</td><td>${e.rate}</td><td><select data-sh="${e.id}">${S.shifts.map(s=>`<option value="${s.id}" ${e.shift===s.id?'selected':''}>${s.name}</option>`).join('')}</select></td><td><button class="no" data-del="${e.id}">Buang</button></td></tr>`).join('')}</table></div></div>
<div class="card"><h2>Tambah Pekerja</h2><div class="row"><label>ID<input id="ni" size="6"></label><label>Nama<input id="nn"></label><label>Jawatan<input id="nr"></label><label>RM/jam<input id="nt" type="number" value="9" style="width:80px"></label><button class="p" id="add">Tambah</button></div></div>`}
document.addEventListener('click',e=>{const t=e.target;
if(t.id==='bell'){tab='notif';render()}
if(t.dataset.t){tab=t.dataset.t;render()}
if(t.id==='mark'){S.notes.forEach(n=>n.to===role&&(n.read=true));save();render()}
if(t.dataset.a){const l=S.leaves.find(x=>x.id==t.dataset.i);l.status=t.dataset.a;notify(l.emp,`Cuti ${l.from} → ${l.to} anda ${l.status==='approved'?'DILULUSKAN':'DITOLAK'}`);render()}
if(t.id==='lsub'){const f=$('#lp').files[0],a=$('#lf').value,b=$('#ltt').value;if(!a||!b||b<a)return toast('Tarikh tidak sah');
S.leaves.unshift({id:Date.now(),emp:role,type:$('#lt').value,from:a,to:b,reason:$('#lr').value,proof:f?f.name:'',status:'pending'});notify('manager',`${nm(role)} mohon ${$('#lt').value} (${a} → ${b})${f?'':' - tiada bukti'}`);toast('Permohonan dihantar');render()}
if(t.id==='imp'){const n=importCSV($('#ta').value);toast(n+' rekod diimport');render()}
if(t.id==='demo'){const ids=S.emps.map(e=>e.id);let o='';for(let i=1;i<=5;i++){const d=addDays(today,-i);ids.forEach((id,k)=>{const s=shiftOf(id,d);if(!s)return;const a=tm(s.s)+((i+k)%3===0?18:-5),b=tm(s.e)+((i+k)%2?45:2);o+=`${id},${d},${hm(a)},${hm(b)}\n`})}$('#ta').value=o}
if(t.id==='add'){const id=$('#ni').value.trim(),n=$('#nn').value.trim();if(!id||!n||S.emps.some(e=>e.id===id))return toast('ID kosong/telah wujud');S.emps.push({id,name:n,role:$('#nr').value,rate:+$('#nt').value||9,shift:'P'});save();render()}
if(t.dataset.del&&confirm('Buang pekerja?')){S.emps=S.emps.filter(e=>e.id!==t.dataset.del);save();render()}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='role'){role=t.value;tab='';render()}
if(t.id==='wk'){wk=mondayOf(t.value);render()}
if(t.dataset.k){S.sched[t.dataset.k]=t.value;save()}
if(t.dataset.sh){S.emps.find(x=>x.id===t.dataset.sh).shift=t.value;save()}
if(t.id==='gm'){gm=t.value;render()}
if(['c1','c2','c3','c4'].includes(t.id)){S.cfg={grace:+$('#c1').value,otMin:+$('#c2').value,otRate:+$('#c3').value,hrs:+$('#c4').value};save();render()}
if(t.id==='csv'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#ta').value=r.result};r.readAsText(t.files[0])}});
if(!S.leaves.length){S.leaves.push({id:1,emp:'102',type:'MC',from:today,to:today,reason:'Demam',proof:'',status:'pending'});notify('manager','Siti mohon MC - tiada bukti')}
render();
</script></body></html>
